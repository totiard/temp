<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulasan Pelanggan</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fff; color: #333; margin: 0; padding: 15px; }
        #reviews-widget { max-width: 600px; margin: 20px auto; }
        .review-card { display: flex; align-items: flex-start; border-bottom: 1px solid #eee; padding: 15px 0; }
        .review-card:last-child { border-bottom: none; }
        .author-photo { width: 48px; height: 48px; border-radius: 50%; margin-right: 15px; }
        .review-content { flex: 1; }
        .review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .author-name { font-weight: bold; }
        .review-time { color: #888; font-size: 0.85em; }
        .rating-stars { color: #f5b32a; }
        .review-text { font-size: 0.95em; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .loading-state, .error-state { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div id="reviews-widget">
        <h3>Ulasan dari Google</h3>
        <div id="reviews-list">
            <div class="loading-state">Memuat ulasan...</div>
        </div>
    </div>

    <script>
        // --- GANTI DENGAN URL WORKER ANDA YANG AKTIF ---
        const WORKER_URL = 'https://api-ulasan-google.workers.dev';

        function generateStars(rating) {
            return '★'.repeat(rating) + '☆'.repeat(5 - rating);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const reviewsList = document.getElementById('reviews-list');

            fetch(WORKER_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(reviews => {
                    reviewsList.innerHTML = '';
                    if (!reviews || reviews.length === 0) {
                        reviewsList.innerHTML = '<p>Belum ada ulasan yang ditampilkan.</p>';
                        return;
                    }
                    reviews.forEach(review => {
                        const card = document.createElement('div');
                        card.className = 'review-card';
                        card.innerHTML = `
                            <img src="${review.profile_photo_url}" alt="${review.author_name}" class="author-photo">
                            <div class="review-content">
                                <div class="review-header">
                                    <span class="author-name">${review.author_name}</span>
                                    <span class="review-time">${review.relative_time_description}</span>
                                </div>
                                <div class="rating-stars">${generateStars(review.rating)}</div>
                                <p class="review-text">${review.text}</p>
                            </div>
                        `;
                        reviewsList.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    reviewsList.innerHTML = '<div class="error-state">Gagal memuat ulasan. Silakan coba lagi nanti.</div>';
                });
        });
    </script>
</body>
</html>
